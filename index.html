<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#213143">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Разгрузить голову">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Разгрузить голову</title>
  <style>
    :root {
      --ink: #203044;
      --paper: #f4f7f8;
      --line: #d6e0e5;
      --muted: #657686;
      --home: #ffdf87;
      --work: #b6d9d2;
      --pay: #f4b7a9;
      --buy: #bfc8ec;
      --cut: #e4b8d4;
      --other: #cfe2ac;
      --done: #93a2ae;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Avenir, system-ui, sans-serif;
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { max-width: 760px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom)); }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 2px 3px 25px; }
    h1 { font-size: clamp(28px, 8vw, 40px); letter-spacing: -1.5px; line-height: .96; margin: 0; font-weight: 800; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .menu { position: relative; flex: none; }
    .menu summary { cursor: pointer; list-style: none; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 9px 12px; font-size: 14px; white-space: nowrap; }
    .menu summary::-webkit-details-marker { display: none; }
    .menu-body { position: absolute; right: 0; top: 44px; z-index: 3; min-width: 180px; padding: 7px; background: #fff; border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 12px 26px #28425522; }
    .menu button, .import-label { display: block; cursor: pointer; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 9px; border-radius: 8px; font-size: 14px; }
    .menu button:hover, .import-label:hover { background: var(--paper); }
    #import-file { display: none; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .board {
      --tile: #fff;
      min-height: 190px;
      border: 1px solid color-mix(in srgb, var(--tile) 45%, var(--ink));
      border-radius: 20px;
      background: var(--tile);
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .board-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    h2 { font-size: 19px; letter-spacing: -.4px; margin: 0; font-weight: 800; }
    .count { min-width: 25px; text-align: center; border-radius: 999px; background: #ffffffa8; padding: 3px 7px; font-size: 12px; font-weight: 700; }
    .entry { display: flex; gap: 6px; margin: 13px 0 10px; }
    .entry input { min-width: 0; flex: 1; padding: 8px 9px; border: 1px solid #ffffffb8; border-radius: 9px; outline: none; background: #ffffffab; font-size: 14px; }
    .entry input:focus { border-color: var(--ink); box-shadow: 0 0 0 2px #ffffff9c; }
    .add { flex: none; width: 35px; border: 0; border-radius: 9px; background: var(--ink); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
    .tasks { display: grid; gap: 4px; }
    .task { display: grid; grid-template-columns: 22px minmax(0, 1fr) 20px; align-items: start; gap: 4px; padding: 5px 1px; font-size: 14px; line-height: 1.25; }
    .check { appearance: none; cursor: pointer; width: 18px; height: 18px; margin: 0; border: 1.5px solid #567; border-radius: 5px; background: #ffffff88; }
    .check:checked { border-color: var(--ink); background: var(--ink); }
    .check:checked::after { content: "✓"; display: block; color: white; font-size: 13px; font-weight: bold; line-height: 16px; text-align: center; }
    .task:has(.check:checked) .task-text { text-decoration: line-through; color: #62717a; }
    .remove { cursor: pointer; visibility: hidden; border: 0; padding: 0; background: none; color: #6c3b45; font-size: 19px; line-height: 16px; }
    .task:hover .remove, .task:focus-within .remove { visibility: visible; }
    .empty { margin: 5px 0 0; color: #5d6d78; font-size: 13px; line-height: 1.3; }
    .done-wrap { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 15px; }
    .done-toggle { cursor: pointer; color: var(--muted); font-size: 14px; }
    .done-toggle summary { list-style: none; }
    .done-toggle summary::-webkit-details-marker { display: none; }
    .done-toggle summary::after { content: "⌄"; display: inline-block; margin-left: 5px; }
    .done-toggle[open] summary::after { transform: rotate(180deg); }
    .done-list { display: grid; gap: 5px; margin-top: 10px; }
    .done-item { color: var(--done); font-size: 13px; text-decoration: line-through; }
    @media (max-width: 430px) { .app { padding-left: 12px; padding-right: 12px; } .grid { gap: 9px; } .board { padding: 12px; min-height: 177px; border-radius: 17px; } h2 { font-size: 17px; } }
    @media (prefers-reduced-motion: no-preference) { .task { animation: appear .16s ease-out; } @keyframes appear { from { opacity: 0; transform: translateY(-3px); } } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1>Разгрузить<br>голову</h1><p class="hint">Записала — и больше не держишь в голове.</p></div>
      <details class="menu"><summary>Данные</summary><div class="menu-body"><button id="export">Скачать копию</button><label class="import-label" for="import-file">Загрузить копию</label><input id="import-file" type="file" accept="application/json"></div></details>
    </header>
    <section id="boards" class="grid" aria-label="Списки задач"></section>
    <section id="done-section" class="done-wrap" hidden><details class="done-toggle"><summary id="done-title">Сделано сегодня</summary><div id="done-list" class="done-list"></div></details></section>
  </main>
  <script>
    const KEY = 'mind-clear-v1';
    const groups = [
      ['home', 'Дом', 'var(--home)'], ['work', 'Работа', 'var(--work)'], ['pay', 'Заплатить', 'var(--pay)'],
      ['buy', 'Купить', 'var(--buy)'], ['cut', 'Постричь', 'var(--cut)'], ['other', 'Другое', 'var(--other)']
    ];
    let state = load();
    function load() { try { const saved = JSON.parse(localStorage.getItem(KEY)); return saved?.tasks ? saved : { tasks: [] }; } catch { return { tasks: [] }; } }
    function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function active(group) { return state.tasks.filter(t => t.group === group && !t.done); }
    function render() {
      const boards = document.querySelector('#boards'); boards.innerHTML = '';
      groups.forEach(([id, name, colour]) => {
        const list = active(id);
        const board = document.createElement('article'); board.className = 'board'; board.style.setProperty('--tile', colour);
        board.innerHTML = `<div class="board-top"><h2>${name}</h2><span class="count">${list.length}</span></div><form class="entry"><input aria-label="Новая задача: ${name}" autocomplete="off" placeholder="Что нужно?"><button class="add" aria-label="Добавить в ${name}">+</button></form><div class="tasks">${list.length ? list.map(taskHTML).join('') : '<p class="empty">Пока пусто</p>'}</div>`;
        board.querySelector('form').addEventListener('submit', e => { e.preventDefault(); const input = e.currentTarget.elements[0]; const text = input.value.trim(); if (!text) return; state.tasks.unshift({ id: createId(), group: id, text, done: false, createdAt: Date.now() }); persist(); render(); requestAnimationFrame(() => document.querySelector(`[aria-label="Новая задача: ${name}"]`).focus()); });
        board.querySelectorAll('.check').forEach(box => box.addEventListener('change', () => { const task = state.tasks.find(t => t.id === box.dataset.id); task.done = box.checked; task.doneAt = box.checked ? Date.now() : null; persist(); render(); }));
        board.querySelectorAll('.remove').forEach(button => button.addEventListener('click', () => { state.tasks = state.tasks.filter(t => t.id !== button.dataset.id); persist(); render(); }));
        boards.append(board);
      });
      const done = state.tasks.filter(t => t.done && new Date(t.doneAt).toDateString() === new Date().toDateString());
      document.querySelector('#done-section').hidden = !done.length;
      document.querySelector('#done-title').textContent = `Сделано сегодня · ${done.length}`;
      document.querySelector('#done-list').innerHTML = done.map(t => `<div class="done-item">${escapeHTML(t.text)}</div>`).join('');
    }
    function taskHTML(t) { return `<label class="task"><input class="check" type="checkbox" data-id="${t.id}"><span class="task-text">${escapeHTML(t.text)}</span><button class="remove" type="button" data-id="${t.id}" aria-label="Удалить задачу">×</button></label>`; }
    // crypto.randomUUID доступен не во всех браузерах при открытии страницы по обычному http-адресу.
    function createId() { return globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`; }
    function escapeHTML(value) { const el = document.createElement('div'); el.textContent = value; return el.innerHTML; }
    document.querySelector('#export').addEventListener('click', () => { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const link = Object.assign(document.createElement('a'), { href: url, download: `razgruzit-golovu-${new Date().toISOString().slice(0,10)}.json` }); link.click(); URL.revokeObjectURL(url); });
    document.querySelector('#import-file').addEventListener('change', event => { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { try { const data = JSON.parse(reader.result); if (!Array.isArray(data.tasks)) throw Error(); state = data; persist(); render(); } catch { alert('Не удалось прочитать этот файл. Выберите копию из этого приложения.'); } }; reader.readAsText(file); event.target.value = ''; });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    render();
  </script>
</body>
</html>
